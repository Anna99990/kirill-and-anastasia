$(document).ready(function(){
    let myAudio = document.getElementById("bg-sound");
    let fadeTime = 300;
    myAudio.volume = 0.4;

    // Начальное состояние: показываем stop, скрываем play
    $(".playbgmusic").hide();
    $(".stopbgmusic").show();

    // Функция запуска
    function playTrack() {
        myAudio.play()
            .then(() => {
                console.log("Музыка играет");
                $(".stopbgmusic").fadeOut(fadeTime);
                $(".playbgmusic").fadeIn(fadeTime);
            })
            .catch(err => console.error("Ошибка play:", err));
    }

    // Функция остановки
    function pauseTrack() {
        myAudio.pause();
        console.log("Музыка остановлена");
        $(".playbgmusic").fadeOut(fadeTime);
        $(".stopbgmusic").fadeIn(fadeTime);
    }

    // ДЕЛЕГИРОВАНИЕ: обработчики на document
    $(document).on("click", ".stopbgmusic", function(e) {
        e.preventDefault();
        if (myAudio.paused) {
            playTrack();
        } else {
            console.log("Музыка уже играет, игнорируем");
        }
    });

    $(document).on("click", ".playbgmusic", function(e) {
        e.preventDefault();
        if (!myAudio.paused) {
            pauseTrack();
        } else {
            console.log("Музыка уже на паузе, игнорируем");
        }
    });

    // При окончании трека возвращаем исходное состояние
    myAudio.addEventListener("ended", function() {
        console.log("Трек закончен");
        $(".playbgmusic").fadeOut(fadeTime);
        $(".stopbgmusic").fadeIn(fadeTime);
    });

    // Автовоспроизведение (если разрешено)
    myAudio.play().catch(() => console.log("Автовоспроизведение заблокировано, ждём клика"));
});

<script>
(function() {
    function sendToTelegram(formEl, submitBtn) {
        if (submitBtn && submitBtn.getAttribute('data-sending') === 'true') return;
        if (submitBtn) submitBtn.setAttribute('data-sending', 'true');

        // Сбор данных из всех полей формы
        const inputs = formEl.querySelectorAll('input, textarea, select');
        let dataMap = {};
        inputs.forEach(input => {
            if (input.name && !input.name.includes('tildaspec') && !input.name.includes('form-spec') && input.name !== 'formservices[]') {
                if (input.type === 'radio' || input.type === 'checkbox') {
                    if (input.checked) {
                        if (dataMap[input.name]) {
                            dataMap[input.name] += ', ' + input.value;
                        } else {
                            dataMap[input.name] = input.value;
                        }
                    }
                } else {
                    if (input.value && input.value.trim() !== '') {
                        dataMap[input.name] = input.value;
                    }
                }
            }
        });

        // Заголовки полей
        let titles = {};
        const inputsDataEl = document.querySelector('.tn-atom__inputs-textarea') || document.querySelector('.tn-atom__inputs-data');
        if (inputsDataEl) {
            try {
                const jsonText = inputsDataEl.value || inputsDataEl.textContent || inputsDataEl.getAttribute('data-value');
                if (jsonText) {
                    const inputsData = JSON.parse(jsonText);
                    inputsData.forEach(item => {
                        if (item.li_nm) titles[item.li_nm] = item.li_title || item.li_nm;
                        if (item.li_name) titles[item.li_name] = item.li_title || item.li_nm;
                    });
                }
            } catch (err) {}
        }

        // Формирование сообщения
        let message = "🎉 Новая анкета гостя (Кирилл & Анастасия):\n\n";
        let hasData = false;
        for (let key in dataMap) {
            let title = titles[key] || key;
            message += `🔹 ${title}:\n${dataMap[key]}\n\n`;
            hasData = true;
        }

        if (!hasData) {
            message += "(Форма отправлена пустой)\n";
        }

        const botToken = "8615039987:AAGOvrFohHpEI2sw65HOd2dFlFVjoB6_Suw";
        
        // Поле chatId оставлено пустым по умолчанию, считывается с URL параметра ?chat_id=...
        const urlParams = new URLSearchParams(window.location.search);
        let chatId = urlParams.get('chat_id') || ""; 

        let originalText = submitBtn ? (submitBtn.textContent || submitBtn.value || "ОТПРАВИТЬ") : "ОТПРАВИТЬ";
        if (submitBtn) {
            if (submitBtn.tagName === 'INPUT') submitBtn.value = "Отправка...";
            else submitBtn.textContent = "Отправка...";
            submitBtn.style.opacity = "0.7";
        }

        function showSuccess() {
            let successBox = formEl.querySelector('.t-form__successbox') || formEl.querySelector('.js-successbox') || document.querySelector('.t-form__successbox');
            if (!successBox) {
                successBox = document.createElement('div');
                successBox.className = 't-form__successbox';
                successBox.style.cssText = 'background-color: #d4edda; color: #155724; border: 2px solid #28a745; padding: 16px 20px; border-radius: 12px; text-align: center; font-size: 18px; font-weight: bold; margin: 15px 0; box-shadow: 0 4px 12px rgba(40,167,69,0.15);';
                if (submitBtn && submitBtn.parentNode) {
                    submitBtn.parentNode.insertBefore(successBox, submitBtn);
                } else {
                    formEl.appendChild(successBox);
                }
            }
            const errorBox = formEl.querySelector('.t-form__errorbox-wrapper') || document.querySelector('.t-form__errorbox-wrapper');
            if (errorBox) errorBox.style.display = 'none';
            
            successBox.style.display = 'block';
            successBox.innerHTML = '<div class="t-form__successbox-text" style="color:#155724; font-weight:bold; font-size: 18px;">Спасибо! Ваши ответы успешно отправлены. Ждем вас на свадьбе! ❤️</div>';
            
            if (submitBtn) submitBtn.style.display = 'none';
            if (formEl.reset) formEl.reset();
        }

        function resetBtn() {
            if (submitBtn) {
                if (submitBtn.tagName === 'INPUT') submitBtn.value = originalText;
                else submitBtn.textContent = originalText;
                submitBtn.style.opacity = "1";
                submitBtn.removeAttribute('data-sending');
            }
        }

        // Если chatId передан через ?chat_id=...
        if (chatId) {
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: message })
            }).then(res => {
                if (res.ok) showSuccess();
                else alert('Ошибка при отправке в Telegram.');
            }).catch(err => alert('Ошибка сети.'))
            .finally(() => resetBtn());
        } else {
            // Если chatId пустой, отправляем на бэкенд с хостом сайта (window.location.hostname),
            // чтобы бот привязал сайт автоматически клиенту!
            const currentDomain = window.location.hostname;
            fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ site_id: currentDomain, message: message, data: dataMap })
            }).then(res => res.json()).then(resData => {
                if (resData.status === 'success' || resData.sent > 0) {
                    showSuccess();
                } else {
                    // Дефолтная отправка администратору @yudinkkka
                    fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: "770473480", text: message })
                    }).then(res => showSuccess()).catch(() => showSuccess());
                }
            }).catch(() => {
                // Если /api/submit локально недоступен, отправляем на базовый chat_id
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: "770473480", text: message })
                }).then(res => showSuccess()).catch(() => showSuccess());
            }).finally(() => resetBtn());
        }
    }

    document.addEventListener('click', function(e) {
        const submitBtn = e.target.closest('.t-submit') || e.target.closest('button[type="submit"]') || e.target.closest('.t-btn');
        if (submitBtn) {
            const formEl = submitBtn.closest('.t-form') || submitBtn.closest('form') || submitBtn.closest('.tn-elem');
            if (formEl) {
                if (formEl.checkValidity && !formEl.checkValidity()) return;
                e.preventDefault();
                e.stopImmediatePropagation();
                sendToTelegram(formEl, submitBtn);
            }
        }
    }, true);

    document.addEventListener('submit', function(e) {
        const formEl = e.target.closest('.t-form') || e.target.closest('form');
        if (formEl) {
            e.preventDefault();
            e.stopImmediatePropagation();
            const submitBtn = formEl.querySelector('button[type="submit"]') || formEl.querySelector('.t-submit');
            sendToTelegram(formEl, submitBtn);
        }
    }, true);
})();
</script>
<script type="text/javascript">
(function() {
    function setupAutoplayLoop() {
        var videos = document.querySelectorAll('video');
        videos.forEach(function(video) {
            video.muted = true;
            video.defaultMuted = true;
            video.loop = true;
            video.playsInline = true;
            video.autoplay = true;
            video.setAttribute('playsinline', 'true');
            video.setAttribute('webkit-playsinline', 'true');
            video.setAttribute('muted', '');
            video.setAttribute('loop', '');
            video.setAttribute('autoplay', '');
            video.setAttribute('preload', 'auto');

            function forcePlay() {
                video.muted = true;
                var p = video.play();
                if (p && p.catch) {
                    p.catch(function(err) {
                        console.log('Autoplay waiting for interaction:', err);
                    });
                }
            }

            // Guarantee continuous loop even if browser loop flag glitches
            video.addEventListener('ended', function() {
                video.currentTime = 0;
                forcePlay();
            });

            forcePlay();

            // Fallbacks for low-power mode or mobile policy locks
            ['touchstart', 'touchend', 'scroll', 'click', 'pointerdown'].forEach(function(evt) {
                window.addEventListener(evt, forcePlay, { passive: true, once: true });
            });

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    forcePlay();
                }
            });
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupAutoplayLoop);
    } else {
        setupAutoplayLoop();
    }
    window.addEventListener('load', setupAutoplayLoop);
})();
</script>
